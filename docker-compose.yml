version: '3.8'

services:
  # FastApi Doubt Solver, Test Engine & Analytics Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jee_doubt_solver_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./backend/data:/app/data
    depends_on:
      - qdrant

  # Qdrant Vector Database for Syllabus & PYQ Retrieval
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jee_qdrant_db
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
    driver: local
